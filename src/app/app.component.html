<app-navbar></app-navbar>
<!-- GLOBAL LOADER -->

<div class="global-loader" *ngIf="isLoading">
  <div class="loader-wrapper">
    <div class="wave wave1"></div>

    <div class="wave wave2"></div>

    <img src="assets/images/diamond_png.png" alt="Loading" />
    <!-- <span>OZO</span> -->
    <div class="wave wave3"></div>

    <div class="wave wave4"></div>
  </div>
</div>

<router-outlet></router-outlet>

<a
  class="floating-custom-design-btn app-download-floating-btn"
  href="https://YOUR-DOWNLOAD-DOMAIN/downloads/ozo.apk"
  download="ozo.apk"
  aria-label="Download OZO Android App"
  title="Download OZO App"
>
  <!-- Android Icon -->
  <svg
    class="android-icon"
    viewBox="0 0 24 24"
    xmlns="http://www.w3.org/2000/svg"
  >
    <path
      fill="currentColor"
      d="M17.6 9.48 19.44 6.3a.5.5 0 0 0-.87-.5l-1.86 3.2a11.1 11.1 0 0 0-9.42 0L5.43 5.8a.5.5 0 1 0-.87.5L6.4 9.48A9.7 9.7 0 0 0 2 17h20a9.7 9.7 0 0 0-4.4-7.52ZM7.5 13.5a.9.9 0 1 1 0-1.8.9.9 0 0 1 0 1.8Zm9 0a.9.9 0 1 1 0-1.8.9.9 0 0 1 0 1.8ZM4 18h16v2a2 2 0 0 1-2 2h-1v-3h-2v3h-6v-3H7v3H6a2 2 0 0 1-2-2Z"
    />
  </svg>

  <span class="app-download-text">
    <strong>DOWNLOAD APP</strong>
    <small>Get OZO on Android</small>
  </span>

  <!-- Download Icon -->
  <svg
    class="download-icon"
    viewBox="0 0 24 24"
    xmlns="http://www.w3.org/2000/svg"
  >
    <path
      fill="currentColor"
      d="M5 20h14v-2H5v2Zm7-18v10.17l3.59-3.58L17 10l-5 5-5-5 1.41-1.41L11 12.17V2h1Z"
    />
  </svg>
</a>

<app-user-login [isAuthOpen]="isAuthOpen" (close)="closeAuthModal($event)">
</app-user-login>
<app-footer></app-footer>
