<div class="container my-5">

    <div class="row">

        <!-- 🔹 LEFT: CART ITEMS -->
        <div class="col-lg-8">

            <h3 class="mb-4">Shopping Cart</h3>

            <div class="cart-item" *ngFor="let item of cartItems">

                <!-- Image -->
                <div>
                    <img [src]="item.image" class="cart-img">
                </div>

                <!-- Product Details -->
                <div class="flex-grow-1">

                    <h6>{{item.name}}</h6>
                    <p>₹ {{item.price}}</p>

                    <!-- Qty + Total -->
                    <div class="d-flex align-items-center justify-content-between mt-2">

                        <div class="qty-box">
                            <button (click)="decrease(item)">-</button>

                            <input type="number" [ngModel]="item.qty" (ngModelChange)="item.qty = +$event">

                            <button (click)="increase(item)">+</button>
                        </div>

                        <div class="fw-bold">
                            ₹ {{item.price * item.qty}}
                        </div>

                    </div>

                </div>

                <!-- Remove -->
                <i class="fa fa-times remove-btn" (click)="remove(item)">
                </i>

            </div>

        </div>

        <!-- 🔹 RIGHT: SUMMARY -->
        <div class="col-lg-4">

            <div class="summary-box">

                <h5>Order Summary</h5>

                <div class="summary-row">
                    <span>Subtotal</span>
                    <span>₹ {{getSubtotal()}}</span>
                </div>

                <div class="summary-row">
                    <span>Shipping</span>
                    <span>Free</span>
                </div>

                <hr>

                <div class="summary-row total">
                    <span>Total</span>
                    <span>₹ {{getSubtotal()}}</span>
                </div>

                <button class="btn checkout-btn w-100 mt-3">
                    Proceed to Checkout
                </button>

            </div>

        </div>

    </div>

</div>
