<div class="container wishlist-page my-5">

    <h2 class="wishlist-title mb-4">My Wishlist</h2>

    <!-- Wishlist Card -->
    <div class="wishlist-card" *ngFor="let item of wishlist">

        <!-- Product Image -->
        <div class="wishlist-image">
            <img [src]="item.image" alt="">
        </div>

        <!-- Product Details -->
        <div class="wishlist-details">

            <h5>{{item.name}}</h5>

            <p class="category">
                Gold Jewellery
            </p>

            <div class="price">
                ₹ {{item.price}}
            </div>

        </div>

        <!-- Actions -->
        <div class="wishlist-actions">

            <button class="btn cart-btn" (click)="moveToCart(item)">
                <i class="fa fa-shopping-cart me-2"></i>
                Add to Cart
            </button>

            <button class="delete-btn" (click)="remove(item)">
                <i class="fa fa-trash"></i>
            </button>

        </div>

    </div>

</div>
