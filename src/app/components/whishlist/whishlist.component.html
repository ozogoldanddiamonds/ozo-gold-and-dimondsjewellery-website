<div class="container my-5">

    <h3 class="mb-4">My Wishlist</h3>

    <!-- Header -->
    <div class="row fw-bold mb-3 d-none d-md-flex">
        <div class="col-md-2">Product</div>
        <div class="col-md-4"></div>
        <div class="col-md-2 text-center">Price</div>
        <div class="col-md-2 text-center">Action</div>
        <div class="col-md-2 text-center">Remove</div>
    </div>

    <!-- Items -->
    <div class="wishlist-item row align-items-center" *ngFor="let item of wishlist">

        <!-- Image -->
        <div class="col-md-2">
            <img [src]="item.image" class="wishlist-img">
        </div>

        <!-- Name -->
        <div class="col-md-4">
            <h6>{{item.name}}</h6>
            <small class="text-muted">Gold / Diamond</small>
        </div>

        <!-- Price -->
        <div class="col-md-2 text-center">
            ₹ {{item.price}}
        </div>

        <!-- Move to cart -->
        <div class="col-md-2 text-center">
            <button class="btn move-btn" (click)="moveToCart(item)">
                Add to Cart
            </button>
        </div>

        <!-- Remove -->
        <div class="col-md-2 text-center">
            <i class="fa fa-times remove-btn" (click)="remove(item)"></i>
        </div>

    </div>

</div>
